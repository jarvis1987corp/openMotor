name: Unit Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --frozen --no-install-project
        uv pip install --python .venv/bin/python -r pyinstaller/requirements-build.txt

    - name: Build mathlib
      run: |
        uv run python setup.py build_ext --inplace

    - name: Lint with ruff
      run: |
        uv run ruff check . --select E9,F63,F7,F82
        uv run ruff check . --exit-zero

    - name: Run unit tests
      run: |
        PYTHONPATH=. uv run python test/unit.py

    - name: Build UI and run localization tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        for form in uilib/views/forms/*.ui; do
          uv run --frozen pyuic6 "$form" -o "uilib/views/$(basename "${form%.ui}")_ui.py"
        done
        PYTHONPATH=. uv run --frozen python -m unittest discover -s test/localization -v

    - name: Run Design Assistant core and GUI tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        PYTHONPATH=. uv run --frozen python -m unittest discover -s test/designassistant -v
        PYTHONPATH=. uv run --frozen python -m unittest discover -s test/designassistant_gui -v
        PYTHONPATH=. uv run --frozen python -m unittest discover -s test/packaging -v
